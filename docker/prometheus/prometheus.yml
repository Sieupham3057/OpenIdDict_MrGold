global:
  scrape_interval: 5s        # Thu thập metrics mỗi 5 giây
  evaluation_interval: 5s

scrape_configs:

  # .NET API — expose qua /metrics (prometheus-net.AspNetCore)
  # Dùng tên service Docker (api:8080) vì API đã chạy trong cùng Docker network
  - job_name: 'dotnet-api'
    static_configs:
      - targets: ['api:8080']
    metrics_path: '/metrics'

  # cAdvisor — CPU/RAM/Network của từng Docker container
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
