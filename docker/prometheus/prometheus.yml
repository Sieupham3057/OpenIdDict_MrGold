global:
  scrape_interval: 5s        # Thu thập metrics mỗi 5 giây
  evaluation_interval: 5s

scrape_configs:

  # .NET API — expose qua /metrics (prometheus-net.AspNetCore)
  # Dùng tên service Docker (api:8080) vì API đã chạy trong cùng Docker network
  - job_name: 'dotnet-api'
    static_configs:
      - targets: ['api:8080']
    metrics_path: '/metrics'

  # cAdvisor — CPU/RAM/Network của từng Docker container
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    metric_relabel_configs:
      # containerd integration dùng hash làm name — extract tên từ image thay thế
      # vd: docker.io/library/docker-api:latest → name="docker-api"
      - source_labels: [image]
        regex: '[^/]+/[^/]+/([^:]+):.*'
        target_label: name
        replacement: '${1}'
        action: replace
