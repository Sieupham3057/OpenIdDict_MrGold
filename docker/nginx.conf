# Nginx Load Balancer — AuthDemo
# Phân phối request giữa VM1 và VM2
# Thay 192.168.1.36 bằng IP thực của VM2 trước khi dùng

events {
    worker_connections 4096;
}

http {
    # ─── Upstream pool — 2 API instance ──────────────────────────────────────────
    upstream api_backend {
        least_conn;     # Gửi đến node ít connection nhất — tốt hơn round-robin
                        # khi response time giữa 2 instance lệch nhau

        server 192.168.1.35:5000 max_fails=3 fail_timeout=30s;  # VM1 — đổi IP nếu cần
        server 192.168.1.36:5000 max_fails=3 fail_timeout=30s;  # VM2 — ĐỔI IP NÀY

        keepalive 64;   # Tái sử dụng connection đến backend, giảm TCP handshake overhead
    }

    # ─── Log format — ghi rõ request đến backend nào ─────────────────────────────
    log_format lb_log '$remote_addr → $upstream_addr [$time_local] '
                      '"$request" $status ${request_time}s '
                      'upstream=${upstream_response_time}s';

    access_log /var/log/nginx/access.log lb_log;

    # ─── Server ──────────────────────────────────────────────────────────────────
    server {
        listen 80;

        # Health check endpoint của LB (không forward đến backend)
        location /lb-health {
            access_log off;
            return 200 'nginx-lb-ok\n';
            add_header Content-Type text/plain;
        }

        # Forward tất cả traffic đến backend pool
        location / {
            proxy_pass http://api_backend;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";   # Cần cho keepalive upstream

            # Timeouts phù hợp với API .NET (login + DB query có thể mất ~1-2s)
            proxy_connect_timeout  5s;
            proxy_send_timeout     60s;
            proxy_read_timeout     60s;

            # Tự động retry sang instance khác nếu instance đang down
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;    # Thử tối đa 2 lần trước khi trả lỗi
        }
    }
}
