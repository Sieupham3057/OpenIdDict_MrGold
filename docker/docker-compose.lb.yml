version: '3.8'

# ─── Load Balancer — Thêm vào VM1 sau khi VM2 đã up ──────────────────────────
#
# Chạy cùng stack monitoring:
#   docker compose -f docker-compose.monitoring.yml \
#                  -f docker-compose.lb.yml up -d nginx-lb
#
# Hoặc chạy riêng LB:
#   docker compose -f docker-compose.lb.yml up -d
#
# Verify LB hoạt động:
#   curl http://192.168.1.35/lb-health           → nginx-lb-ok
#   curl http://192.168.1.35/health              → {"status":"Healthy"} (từ VM1 hoặc VM2)
#   for i in {1..6}; do curl -s http://192.168.1.35/health; done   → 3x VM1, 3x VM2 (least_conn)

services:

  nginx-lb:
    image: nginx:1.25-alpine
    container_name: nginx-lb
    ports:
      - "80:80"     # k6 gửi tới http://192.168.1.35:80 → LB phân phối sang VM1:5000 + VM2:5000
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/lb-health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
