# version: '3.8'

# Monitoring stack for AuthDemo + k6
# Run from: ~/projects/OpenIdDict_MrGold/docker
# Start: docker compose -f docker-compose.monitoring.yml up -d --build
# Reset all monitoring data: docker compose -f docker-compose.monitoring.yml down -v

services:

  # ── API: AuthDemo .NET 8 ────────────────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: AuthDemo.Api/Dockerfile
    container_name: api
    ports:
      - "5000:8080"                        # Host:5000 → Container:8080
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=192.168.1.35,1433;Database=AuthDemoDB;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
      # Certificate dùng chung cho tất cả API instance — bắt buộc khi scale multi-instance.
      # Tạo cert: cd docker/certs && ./gen-cert.sh
      # Copy sang VM khác: scp certs/openiddict.pfx user@192.168.1.36:~/projects/OpenIdDict_MrGold/docker/certs/
      - OpenIddict__CertPath=/app/certs/openiddict.pfx
      - OpenIddict__CertPassword=Lab@OpenIddict2025
    volumes:
      - api-logs:/app/logs
      - ./certs/openiddict.pfx:/app/certs/openiddict.pfx:ro   # Shared cert — tất cả instance phải dùng cùng file này
    restart: unless-stopped

  # ── InfluxDB: k6 writes load-test results here ──────────────────────────────────
  influxdb:
    image: influxdb:1.8
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=k6
      - INFLUXDB_HTTP_AUTH_ENABLED=false
    volumes:
      - influxdb-data:/var/lib/influxdb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ── cAdvisor: Docker container CPU/RAM/Network metrics ──────────────────────────
  # Important: use docker.sock + --docker_only=true so cAdvisor exposes labels for
  # real Docker containers like api, grafana, prometheus, sqlserver, etc.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    privileged: true
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg:/dev/kmsg
    command:
      - "--housekeeping_interval=10s"
      - "--docker_only=true"
      - "--disable_metrics=disk,diskIO,hugetlb,referenced_memory,resctrl,cpuLoad,advtcp,process"
    restart: unless-stopped

  # ── Prometheus: scrapes API /metrics and cAdvisor /metrics ──────────────────────
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    depends_on:
      api:
        condition: service_healthy
      cadvisor:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ── Grafana: UI for Prometheus and InfluxDB ─────────────────────────────────────
  grafana:
    image: grafana/grafana:11.6.1
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  influxdb-data:
  api-logs:
