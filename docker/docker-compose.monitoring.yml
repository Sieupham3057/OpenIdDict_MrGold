version: '3.8'

# Khởi động: cd docker && docker compose -f docker-compose.monitoring.yml up -d
# Dừng:      cd docker && docker compose -f docker-compose.monitoring.yml down

services:

  # ── API: AuthDemo .NET 8 ────────────────────────────────────────────────────────
  api:
    build:
      context: ..                          # Root của project (chứa AuthDemo.Api/)
      dockerfile: AuthDemo.Api/Dockerfile
    container_name: api
    ports:
      - "5000:8080"                        # Host:5000 → Container:8080
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Override connection string không cần rebuild image khi đổi server
      - ConnectionStrings__DefaultConnection=Server=192.168.1.35,1433;Database=AuthDemoDB;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
    volumes:
      - api-logs:/app/logs                 # Giữ log khi container restart
    restart: unless-stopped

  # ── Prometheus: Thu thập và lưu metrics theo dạng time-series ──────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"           # Web UI: http://localhost:9090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    depends_on:
      api:
        condition: service_healthy           # Đợi API healthy trước khi scrape
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ── Grafana: Visualize metrics từ Prometheus và InfluxDB ───────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"           # Web UI: http://localhost:3000 (admin/admin123)
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # ── InfluxDB: Lưu kết quả k6 (time-series database) ───────────────────────────
  influxdb:
    image: influxdb:1.8       # k6 hỗ trợ InfluxDB v1.x native
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=k6
      - INFLUXDB_HTTP_AUTH_ENABLED=false
    volumes:
      - influxdb-data:/var/lib/influxdb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ── cAdvisor: Thu thập CPU/RAM/Network của Docker containers ──────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: cadvisor
    privileged: true
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro  # bypass overlayfs issue
    devices:
      - /dev/kmsg
    command:
      - '--housekeeping_interval=10s'
      - '--containerd=/run/containerd/containerd.sock'
      - '--containerd-namespace=moby'
      - '--disable_metrics=disk,diskIO,hugetlb,referenced_memory,resctrl,cpuLoad,advtcp,process'
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  influxdb-data:
  api-logs:
