version: '3.8'

# Khởi động: cd docker && docker compose -f docker-compose.monitoring.yml up -d
# Dừng:      cd docker && docker compose -f docker-compose.monitoring.yml down

services:

  # ── Prometheus: Thu thập và lưu metrics theo dạng time-series ──────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"           # Web UI: http://localhost:9090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Cho phép trỏ đến API trên host
    restart: unless-stopped

  # ── Grafana: Visualize metrics từ Prometheus và InfluxDB ───────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"           # Web UI: http://localhost:3000 (admin/admin123)
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - influxdb
    restart: unless-stopped

  # ── InfluxDB: Lưu kết quả k6 (time-series database) ───────────────────────────
  influxdb:
    image: influxdb:1.8       # k6 hỗ trợ InfluxDB v1.x native
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=k6
      - INFLUXDB_HTTP_AUTH_ENABLED=false
    volumes:
      - influxdb-data:/var/lib/influxdb
    restart: unless-stopped

  # ── cAdvisor: Thu thập CPU/RAM/Network của Docker containers ──────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  influxdb-data:
